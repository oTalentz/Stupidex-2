# Stupidex — Nginx reverse proxy configuration for production.
#
# Usage:
#   1. Copy to /etc/nginx/sites-available/stupidex
#   2. Edit server_name to your domain
#   3. Enable: ln -s /etc/nginx/sites-available/stupidex /etc/nginx/sites-enabled/
#   4. Test: nginx -t && systemctl reload nginx
#   5. HTTPS: certbot --nginx -d your-domain.com

upstream stupidex {
    server 127.0.0.1:5000;
    keepalive 32;
}

server {
    listen 80;
    server_name your-domain.com;

    # Uncomment for HTTPS redirect (after certbot)
    # return 301 https://$host$request_uri;

    client_max_body_size 50m;

    location / {
        proxy_pass http://stupidex;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE: disable buffering for streaming responses
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # WebSocket support (if needed in future)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Health check endpoint (for monitoring)
    location /api/health {
        proxy_pass http://stupidex;
        proxy_set_header Host $host;
        access_log off;
    }

    # Static assets (optional: serve directly from nginx for performance)
    # location /static/ {
    #     alias /app/src/stupidex/static/;
    #     expires 7d;
    #     add_header Cache-Control "public, immutable";
    # }
}

