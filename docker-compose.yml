version: "3.9"

services:
  stupidex:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stupidex
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    env_file:
      - .env
    environment:
      - STUPIDEX_HOST=0.0.0.0
      - STUPIDEX_PORT=5000
      - STUPIDEX_DEBUG=0
      - STUPIDEX_SERVER=1
      - STUPIDEX_DATA_DIR=/data
      - STUPIDEX_ENABLE_SHELL=1
    volumes:
      - stupidex-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        tag: "stupidex"

  # Optional: nginx reverse proxy for production
  # Uncomment below to add nginx as a reverse proxy
  #
  # nginx:
  #   image: nginx:alpine
  #   container_name: stupidex-nginx
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
  #   depends_on:
  #     stupidex:
  #       condition: service_healthy

volumes:
  stupidex-data:
    driver: local