[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stupidex"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "litellm>=1.40",
    "textual>=0.80",
    "python-dotenv>=1.0",
    "gunicorn>=21.0",
    "waitress>=3.0",
    "cryptography>=42.0",
]

[project.scripts]
stupidex = "stupidex.main:main"
stupidex-web = "stupidex.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stupidex = ["static/**/*", "*.tcss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
